<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Maliha ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg,#170d29,#392044,#713e65);
    color: white;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
}

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(#ffb8df 1px, transparent 1px);
    background-size: 65px 65px, 100px 100px;
    background-position: 0 0, 30px 40px;
    opacity: .35;
}

.page {
    display: none;
    min-height: 100vh;
    padding: 35px 22px;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    position: relative;
    z-index: 2;
    animation: appear 1s ease;
}

.page.active {
    display: flex;
}

@keyframes appear {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 65px;
    color: #ffc6e6;
    font-weight: normal;
    margin-bottom: 15px;
}

h2 {
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 25px;
    color: #ffe3f3;
}

p {
    font-size: 14px;
    line-height: 2;
    color: #f8eaf4;
    max-width: 480px;
}

.card {
    width: 100%;
    max-width: 440px;
    padding: 35px 25px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.09);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    box-shadow: 0 10px 50px rgba(0,0,0,.25);
}

.compliment {
    background: rgba(255,255,255,.1);
    padding: 15px;
    margin: 12px 0;
    border-radius: 15px;
    font-size: 14px;
    color: #ffe1f0;
}

button {
    margin-top: 30px;
    padding: 14px 35px;
    border: none;
    border-radius: 40px;
    background: linear-gradient(90deg,#ffb5d9,#f7d2e9);
    color: #44213e;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 5px 25px rgba(255,170,220,.3);
    transition: .3s;
}

button:hover {
    transform: scale(1.07);
}

.small {
    margin-top: 15px;
    font-size: 11px;
    opacity: .7;
}

.emoji {
    font-size: 45px;
    margin-bottom: 15px;
}

#count {
    font-size: 90px;
    color: #ffc6e6;
    font-weight: 600;
    margin: 25px;
}

.cake {
    font-size: 100px;
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    0%,100% {transform:translateY(0);}
    50% {transform:translateY(-15px);}
}

.balloon {
    position: fixed;
    bottom: -100px;
    font-size: 38px;
    animation: float 8s linear infinite;
    z-index: 5;
    pointer-events: none;
}

@keyframes float {
    to {transform:translateY(-120vh) rotate(20deg);}
}

.sparkle {
    color: #ffc6e6;
    font-size: 20px;
}

</style>
</head>
